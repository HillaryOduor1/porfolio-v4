<!doctype html>

  <head>
    <!-- CRITICAL: VIEWPORT HEIGHT SCRIPT (ES5) -->
    <script>
      (function() {
        function setVh() {
          document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh);
        window.addEventListener('orientationchange', setVh);
      })();
    </script>

    <!-- CRITICAL: THEME SCRIPT (ES5) -->
    <script>
      (function () {
        var KEY = 'theme'; // Ensure this matches your ThemeContext KEY
        var BG_DARK = '#1e1e1e'; // Updated to match VS Code/DeepSeek dark mode
        var BG_LIGHT = '#ffffff';
        var theme, resolved;
        
        try {
          theme = localStorage.getItem(KEY);
          theme = (theme === 'light' || theme === 'dark') ? theme : 'system';
          resolved = theme === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : theme;
              
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.backgroundColor = resolved === 'dark' ? BG_DARK : BG_LIGHT;
          document.documentElement.style.color = resolved === 'dark' ? '#cccccc' : '#1a1a1a';
        } catch (_) {
          resolved = 'light';
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = BG_LIGHT;
          document.documentElement.style.color = '#1a1a1a';
        }

        function setManifest(theme) {
          var manifestPath = theme === 'dark' 
            ? '/dark-mode-favicon/site.webmanifest' 
            : '/light-mode-favicon/site.webmanifest';
          
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.href = manifestPath;
          } else {
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestPath;
            document.head.appendChild(link);
          }
        }

        setManifest(resolved);

        document.addEventListener('themeChanged', function (e) {
          var newTheme = e.detail && e.detail.theme ? e.detail.theme : 'light';
          setManifest(newTheme);
        });

        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addListener(function (e) {
            var stored = localStorage.getItem(KEY);
            if (!stored || stored === 'system') {
              var newTheme = e.matches ? 'dark' : 'light';
              setManifest(newTheme);
            }
          });
        }
      })();
    </script>
