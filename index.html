<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Author Meta -->
    <meta name="author" content="Hillary Oduor">
    
    <!-- Meta Description -->
    <meta name="description" content="I am a passionate Software Engineer specializing in building modern web applications and digital solutions.">
    
    <!-- Meta Keyword -->
    <meta name="keywords" content="Software Engineer,Web Development,React,Node.js,JavaScript,ICT,Full Stack Developer">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hillaryoduor.dev" />
    <meta property="og:title" content="Hillary Oduor - Software Developer" />
    <meta property="og:description" content="I craft Software Solutions to solve real-world problems" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://hillaryoduor.dev" />
    <meta property="twitter:title" content="Hillary Oduor - Software Developer" />
    <meta property="twitter:description" content="I craft Software Solutions to solve real-world problems" />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Remove deprecated apple-mobile-web-app-capable, use manifest instead -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Legacy browser detection and fallback -->
    <script>
      // Detect very old browsers and show a message
      (function() {
        try {
          // Check for ES6 features
          var isES6Supported = true;
          try {
            eval('const test = () => {};');
            eval('let {a} = {a:1};');
          } catch(e) {
            isES6Supported = false;
          }
          
          if (!isES6Supported) {
            document.write('<div style="position:fixed;top:0;left:0;right:0;background:#f44336;color:white;padding:20px;text-align:center;z-index:9999;">');
            document.write('Your browser is outdated. Please <a href="https://browsehappy.com/" style="color:white;text-decoration:underline;">update your browser</a> for the best experience.');
            document.write('</div>');
          }
        } catch(e) {
          // If any error occurs, show the message
          document.write('<div style="position:fixed;top:0;left:0;right:0;background:#f44336;color:white;padding:20px;text-align:center;z-index:9999;">');
          document.write('Your browser is outdated. Please <a href="https://browsehappy.com/" style="color:white;text-decoration:underline;">update your browser</a> for the best experience.');
          document.write('</div>');
        }
      })();
    </script>

    <title>Hillary Oduor - Software Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
